<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>buat fall</title>
<meta name="theme-color" content="#1a1420">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🤍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300;1,9..144,400&family=Inter:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f4ece6; --soft: #bfb0ba; --dim: #7d6f7a; --accent: #f2b8c6; --bg1: #1a1420; --bg2: #2a1d2c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif; color: var(--ink); cursor: default; user-select: none;
    background: radial-gradient(ellipse 120% 90% at 50% 110%, #3b2436 0%, var(--bg2) 40%, var(--bg1) 100%);
  }
  canvas { position: fixed; inset: 0; pointer-events: none; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; padding: 6vh 7vw; }
  .scene { width: min(100%, 760px); text-align: center; opacity: 0; transform: translateY(14px); transition: opacity 1.4s ease, transform 1.4s ease; }
  .scene.show { opacity: 1; transform: none; }
  .scene.leave { opacity: 0; transform: translateY(-10px); transition-duration: .8s; }

  .line { font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: clamp(26px, 3.4vw, 44px); line-height: 1.35; margin: 0; }
  .line em { font-style: italic; color: var(--accent); }
  .small { font-size: clamp(15px, 1.4vw, 18px); color: var(--soft); margin: 18px 0 0; line-height: 1.6; letter-spacing: .2px; }
  .hand { font-family: Caveat, cursive; font-size: clamp(26px, 2.6vw, 34px); color: var(--accent); }
  .reveal > * { opacity: 0; transform: translateY(8px); transition: opacity 1s ease, transform 1s ease; }
  .reveal > .in { opacity: 1; transform: none; }

  /* Adegan chat (ingatan awal kenalan) */
  .chat { width: min(100%, 520px); margin: 0 auto; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 22px; padding: 18px; text-align: left; backdrop-filter: blur(6px); }
  .chat-head { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 14px; }
  .chat-head i { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #6b8cff, #9b7bff); display: grid; place-items: center; font-style: normal; }
  .chat-head b { font-weight: 500; font-size: 15px; } .chat-head small { display: block; color: var(--dim); font-size: 12px; }
  .msgs { display: flex; flex-direction: column; gap: 7px; min-height: 190px; max-height: min(62vh, 560px); overflow-y: auto; scrollbar-width: none; padding-right: 2px; }
  .msgs::-webkit-scrollbar { display: none; }
  .msg img { display: block; width: 210px; max-width: 100%; border-radius: 12px; margin: -4px -8px 8px; }
  .msg.date { align-self: center; font-size: 12px; color: var(--dim); background: none; padding: 6px 0 2px; }
  .msg { max-width: 80%; padding: 10px 16px; border-radius: 16px; font-size: 16px; line-height: 1.4; opacity: 0; transform: translateY(6px); transition: all .5s ease; }
  .msg.in { opacity: 1; transform: none; }
  .msg.sys { align-self: center; background: rgba(255,255,255,.06); color: var(--soft); font-size: 13px; border-radius: 999px; }
  .msg.me { align-self: flex-end; background: #3d6bd6; border-bottom-right-radius: 5px; }
  .msg.you { align-self: flex-start; background: rgba(255,255,255,.1); border-bottom-left-radius: 5px; }

  .polas { display: flex; justify-content: center; gap: 28px; margin-bottom: 34px; }
  .pola { background: #f7f1ea; padding: 10px 10px 36px; width: min(38vw, 190px); box-shadow: 0 20px 40px rgba(0,0,0,.4); position: relative; }
  .pola:first-child { transform: rotate(-4deg); } .pola:last-child { transform: rotate(3deg); }
  .pola img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; filter: saturate(.9) contrast(1.02); }
  .pola span { position: absolute; left: 0; right: 0; bottom: 6px; font-family: Caveat, cursive; color: #5b3a4a; font-size: 22px; }

  .words { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 14px; margin-top: 30px; }
  .words span { font-family: Fraunces, Georgia, serif; font-style: italic; font-size: clamp(20px, 2.1vw, 28px); padding: 8px 20px; border-radius: 999px; border: 1px solid rgba(242,184,198,.35); color: var(--ink); }
  .words span.last { border-color: var(--accent); color: var(--accent); }

  .q { font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: clamp(34px, 4.6vw, 62px); line-height: 1.2; margin: 0 0 44px; }
  .q em { font-style: italic; color: var(--accent); }
  .answers { display: flex; justify-content: center; align-items: center; gap: 22px; min-height: 64px; }
  .btn { font: inherit; font-size: 18px; letter-spacing: .3px; border-radius: 999px; cursor: pointer; transition: transform .35s ease, background .3s ease, left .45s ease, top .45s ease; }
  .yes { padding: 15px 46px; border: 0; background: var(--ink); color: var(--bg1); font-weight: 500; }
  .yes:hover { background: #fff; transform: translateY(-2px); }
  .no { padding: 14px 32px; background: transparent; color: var(--soft); border: 1px solid rgba(255,255,255,.22); }
  .no.moved { position: fixed; }
  .hint { position: fixed; left: 0; right: 0; bottom: 4vh; text-align: center; color: var(--dim); font-size: 13px; letter-spacing: .4px; transition: opacity .6s ease; }
  .hint.hide { opacity: 0; }
  .mute { position: fixed; top: 22px; right: 24px; z-index: 5; background: none; border: 1px solid rgba(255,255,255,.18); color: var(--soft); width: 40px; height: 40px; border-radius: 50%; font-size: 15px; cursor: pointer; }
  .start { font-family: Fraunces, Georgia, serif; font-style: italic; font-size: clamp(20px, 2vw, 26px); color: var(--soft); }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<button class="mute" id="mute" aria-label="Musik" hidden>♪</button>
<div class="stage" id="stage"></div>
<div class="hint" id="hint">klik di mana aja buat lanjut &nbsp;→</div>
<audio id="music" src="lagu.mp3" preload="auto" loop></audio>

<script>
// ============================================================
//  Isi cerita (bisa diedit). Satu item = satu layar.
// ============================================================
const SCENES = [
  { html: `<p class="start">buat fall.</p>` },
  { html: `<p class="line">waktu itu libur semester,<br>aku lagi <em>gabut-gabutnya</em>.</p>` },
  { html: `<p class="line">iseng nyoba bot cari temen di telegram,</p><p class="small">niatnya cuma cari temen ngobrol.</p>` },
  { chat: true },
  { html: `<p class="line">dari tele, pindah ke ig.</p><p class="small">terus cerita-cerita, sampai call sampai malem. hari itu juga.</p>` },
  { html: `<p class="line">terus pelan-pelan, dari ngobrol biasa,<br>akhirnya <em>nyaman</em> dan <em>cocok</em>.</p>` },
  { html: `<div class="polas"><div class="pola"><img src="/img/fall-kecil.jpg" alt=""><span>fall kecil</span></div><div class="pola"><img src="/img/aidan-kecil.jpg" alt=""><span>aidan kecil</span></div></div>
           <p class="line" style="font-size:clamp(22px,2.6vw,32px)"><em>two people who once didn't know each other at all.</em></p>` },
  { words: true, html: `<p class="line">hal-hal yang aku suka dari kamu:</p>
      <div class="words reveal"><span>ketawamu</span><span>tingkah lakumu</span><span>kerandomanmu</span><span>ngambek dan gemesnya kamu</span><span class="last">dan tentu aja, your heart</span></div>` },
  { html: `<p class="line">btw kita udah saling manggil sayang,<br>udah kayak pacaran.</p><p class="small">tapi ada satu hal yang belum pernah aku tanyain ke kamu.</p>` },
  { question: true },
];
const TANYA = `falicya, <em>do you want to be my girlfriend?</em>`;
const NO_LINES = ['beneran? 🥺', 'pikir lagi deh', 'hmm, yakin?'];
const AFTER_YES = `<p class="line">makasih, <em>my baby honey cutey pie</em> 🤍</p><p class="small">aidan bakal berusaha buat jaga dan bikin fall happy tiap saat.</p><p class="hand" style="margin-top:30px">love youu</p>`;
// Obrolan pertama kita (dari Leo, bot cari temen di Telegram)
const CHAT = [
  { t: 'sys', s: '✨ kamu match sama lin', w: 1300 },
  { t: 'date', s: '20 Agustus', w: 700 },
  { t: 'me', img: 'beryy.jpg', s: 'haloo, kenalin aku zaidan dan ini ucing ak namanya beryy, salam kenal yaa', w: 2200 },
  { t: 'me', s: 'btw km suka kucing nggak yaa? hahaha', w: 1500 },
  { t: 'date', s: '21 Agustus', w: 700 },
  { t: 'you', s: 'Hihii', w: 700 },
  { t: 'you', s: 'Lucu bgt ya', w: 800 },
  { t: 'you', s: 'Sukaa si', w: 800 },
  { t: 'you', s: 'Sbb ya, soalnya jrng buka', w: 1300 },
  { t: 'me', s: "it's okayy, aku juga buka tele kalo ada tugas dari tempat magang aja", w: 1500 },
  { t: 'me', s: 'btw kamu lagi kulia kah atau uda kerjaa?', w: 1400 },
  { t: 'you', s: 'Lagii kuliah sii', w: 900 },
  { t: 'you', s: 'Mau move ig aja ga?', w: 1300 },
  { t: 'me', s: 'boleee', w: 900 },
  { t: 'you', s: 'Drop usn kaa', w: 1000 },
  { t: 'me', s: 'iyaa, move ig aja kalo gitu hahaha', w: 1200 },
];
// ============================================================

const stage = document.getElementById('stage');
const hint = document.getElementById('hint');
const music = document.getElementById('music');
const muteBtn = document.getElementById('mute');
let i = -1, busy = false, done = false, musicOn = false;

// Latar: cahaya lembut yang melayang pelan (bokeh)
const cv = document.getElementById('bg'), cx = cv.getContext('2d');
let dots = [], petals = [];
function size() {
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  dots = Array.from({ length: 38 }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: (2 + Math.random() * 5) * devicePixelRatio, v: (.06 + Math.random() * .18) * devicePixelRatio, a: .05 + Math.random() * .16, p: Math.random() * 6 }));
}
addEventListener('resize', size); size();
function draw(t) {
  cx.clearRect(0, 0, cv.width, cv.height);
  for (const d of dots) {
    d.y -= d.v; if (d.y < -20) { d.y = cv.height + 20; d.x = Math.random() * cv.width; }
    cx.globalAlpha = d.a * (.6 + .4 * Math.sin(t / 1800 + d.p));
    const g = cx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r * 3);
    g.addColorStop(0, '#f6d6de'); g.addColorStop(1, 'rgba(246,214,222,0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(d.x, d.y, d.r * 3, 0, 7); cx.fill();
  }
  // kelopak jatuh pelan (setelah dijawab)
  for (const p of petals) {
    p.y += p.v; p.x += Math.sin((t + p.p) / 900) * .6 * devicePixelRatio; p.rot += p.vr;
    cx.globalAlpha = p.a; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.fillStyle = p.c; cx.beginPath(); cx.ellipse(0, 0, p.s, p.s * .6, 0, 0, 7); cx.fill(); cx.restore();
  }
  petals = petals.filter((p) => p.y < cv.height + 30);
  cx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function startMusic() {
  if (musicOn) return;
  music.volume = 0;
  music.play().then(() => {
    musicOn = true; muteBtn.hidden = false;
    let v = 0; const fade = setInterval(() => { v = Math.min(.5, v + .02); music.volume = v; if (v >= .5) clearInterval(fade); }, 120);
  }).catch(() => {});
}
muteBtn.addEventListener('click', (e) => { e.stopPropagation(); music.muted = !music.muted; muteBtn.textContent = music.muted ? '×' : '♪'; });

function show(html, after) {
  const old = stage.firstElementChild;
  if (old) old.classList.add('leave');
  setTimeout(() => {
    stage.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'scene';
    el.innerHTML = html;
    stage.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
    after?.(el);
  }, old ? 800 : 0);
}

function next() {
  if (busy || done) return;
  if (i >= 0 && SCENES[i].question) return;
  busy = true;
  i++;
  const s = SCENES[i];
  hint.classList.toggle('hide', Boolean(s.question || s.chat));
  if (s.chat) {
    show(`<div class="chat"><div class="chat-head"><i>🤖</i><div><b>Leo – match and meet new friends</b><small>bot telegram</small></div></div><div class="msgs"></div></div>`, playChat);
    return;
  }
  if (s.question) {
    show(`<p class="q">${TANYA}</p><div class="answers"><button class="btn yes" id="yes">iya</button><button class="btn no" id="no">nggak</button></div>`, setupQuestion);
    return;
  }
  show(s.html, (el) => {
    if (s.words) el.querySelectorAll('.reveal > span').forEach((w, k) => setTimeout(() => w.classList.add('in'), 1300 + k * 850));
    const wait = s.words ? 1300 + el.querySelectorAll('.reveal > span').length * 850 : 1500;
    setTimeout(() => { busy = false; }, wait);
  });
}

function playChat(el) {
  const box = el.querySelector('.msgs');
  let t = 900;
  CHAT.forEach((m) => {
    setTimeout(() => {
      const d = document.createElement('div');
      d.className = `msg ${m.t}`;
      if (m.img) {
        const im = document.createElement('img');
        im.src = m.img; im.alt = '';
        d.appendChild(im);
      }
      d.appendChild(document.createTextNode(m.s));
      box.appendChild(d);
      requestAnimationFrame(() => { d.classList.add('in'); box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' }); });
    }, t);
    t += m.w;
  });
  setTimeout(() => { busy = false; hint.classList.remove('hide'); }, t + 300);
}

function setupQuestion(el) {
  const yes = el.querySelector('#yes'), no = el.querySelector('#no');
  let tries = 0, gone = false, last = 0;
  const dodge = (e) => {
    e?.preventDefault();
    // satu klik = beberapa event sekaligus; hitung sekali aja per ~0,5 detik
    if (gone || performance.now() - last < 500) return;
    last = performance.now();
    tries++;
    if (tries > NO_LINES.length) {
      // terakhir: mengecil lalu hilang
      gone = true;
      no.style.transition = 'transform .6s ease, opacity .6s ease';
      no.style.transform = 'scale(0)';
      no.style.opacity = '0';
      setTimeout(() => no.remove(), 650);
      return;
    }
    no.textContent = NO_LINES[tries - 1];
    const r = no.getBoundingClientRect();
    const y = yes.getBoundingClientRect();
    const q = el.querySelector('.q').getBoundingClientRect();
    const hit = (x, t, box, pad) => x < box.right + pad && x + r.width > box.left - pad && t < box.bottom + pad && t + r.height > box.top - pad;
    // cari tempat kosong: nggak nutupin tombol "iya" & pertanyaannya, dan agak jauh dari posisi sekarang
    let x = 0, t = 0;
    for (let k = 0; k < 60; k++) {
      x = 40 + Math.random() * (innerWidth - r.width - 80);
      t = 60 + Math.random() * (innerHeight - r.height - 140);
      if (!hit(x, t, y, 70) && !hit(x, t, q, 20) && Math.hypot(x - r.left, t - r.top) > 180) break;
    }
    no.classList.add('moved');
    no.style.left = `${x}px`;
    no.style.top = `${t}px`;
    no.style.transform = `scale(${1 - tries * 0.2})`; // makin kecil tiap kabur
  };
  no.addEventListener('mouseenter', dodge);
  no.addEventListener('pointerdown', dodge);
  no.addEventListener('click', (e) => { e.preventDefault(); dodge(e); }); // nggak pernah bisa dipencet
  yes.addEventListener('click', sayYes);
  busy = false;
}

async function sayYes() {
  if (done) return;
  done = true;
  const d = devicePixelRatio;
  const colors = ['#f6c9d4', '#f2b8c6', '#fbe4ea', '#e9cfe0'];
  for (let k = 0; k < 70; k++) {
    setTimeout(() => petals.push({ x: Math.random() * cv.width, y: -20, v: (.8 + Math.random() * 1.2) * d, s: (4 + Math.random() * 4) * d,
      rot: Math.random() * 6, vr: (Math.random() - .5) * .04, a: .55 + Math.random() * .35, c: colors[k % 4], p: Math.random() * 3000 }), k * 120);
  }
  show(AFTER_YES);
  // Simpan jawabannya diam-diam (buat fitur "hari ke-sekian" nanti)
  try {
    const key = localStorage.getItem('fq-kita-key');
    if (key) {
      await fetch('https://xmbshvmyztvaalcifqib.supabase.co/rest/v1/rpc/kita_jawab', {
        method: 'POST',
        headers: { apikey: 'sb_publishable_Lpbw5KeRUfzUFi1_nksa_g_nIoY9HWR', 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_key: key, p_answer: 'mau' }),
      });
    }
  } catch {}
}

document.addEventListener('click', (e) => { startMusic(); if (!e.target.closest('button')) next(); });
document.addEventListener('keydown', (e) => { if ([' ', 'Enter', 'ArrowRight'].includes(e.key)) { e.preventDefault(); startMusic(); next(); } });
next();
</script>
</body>
</html>
