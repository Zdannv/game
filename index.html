<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Falicya's Love Quest 💖</title>
  <meta name="description" content="Game kecil penuh cinta, khusus buat Falicya.">
  <meta name="theme-color" content="#ffd6e7">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Love Quest">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg-hearts" aria-hidden="true"></div>

  <main id="app">
    <!-- HOME -->
    <section id="screen-home" class="screen active">
      <div class="home-wrap">
        <div class="mascots" aria-hidden="true"><span>🦉</span><span>💖</span><span>🐱</span></div>
        <h1 class="title"><span class="nm">Falicya</span>'s<br><span class="title-2">Love Quest</span></h1>
        <div class="daily-card" id="daily-card" hidden>
          <small>💌 Pesan hari ini dari Aidan</small>
          <p id="daily-text"></p>
        </div>
        <div class="streak-slot" id="streak-home" hidden></div>
        <button class="btn big" id="btn-play">Main yuk! ▶</button>
        <button class="btn ghost kita-btn" id="btn-kita">📮 Kotak Kita <span class="kita-badge" id="kita-badge" hidden></span></button>
        <button class="btn ghost install-btn" id="btn-install" hidden>📲 Pasang ke home screen</button>
        <button class="link-btn" id="btn-reset">reset progress</button>
      </div>
    </section>

    <!-- PETA LEVEL -->
    <section id="screen-map" class="screen">
      <header class="topbar">
        <button class="icon-btn" data-go="home" aria-label="Beranda">🏠</button>
        <div class="star-total">⭐ <span id="star-count">0</span></div>
        <div class="topbar-right">
          <button class="icon-btn" id="btn-music" aria-label="Lagu">🎵</button>
          <button class="icon-btn" id="btn-sound" aria-label="Efek suara">🔊</button>
        </div>
      </header>
      <div class="streak-slot" id="streak-map" hidden></div>
      <div id="worlds"></div>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen">
      <header class="hud">
        <button class="icon-btn small" id="btn-quit" aria-label="Keluar">✖</button>
        <div class="hud-main">
          <div class="hud-title" id="hud-title"></div>
          <div class="hud-stats" id="hud-stats"></div>
        </div>
      </header>
      <div class="guide">
        <span class="guide-owl" id="guide-owl" aria-hidden="true">🦉</span>
        <p class="bubble" id="hud-hint" aria-live="polite"></p>
      </div>
      <div id="stage"></div>
    </section>

    <!-- SURAT -->
    <section id="screen-letter" class="screen">
      <article class="letter">
        <div class="letter-seal">💌</div>
        <h2>To <span class="nm">Falicya</span></h2>
        <div class="polaroids">
          <figure class="polaroid left">
            <img src="img/fall-kecil.jpg" alt="Fall Jr">
            <figcaption>Fall Jr 🦉</figcaption>
          </figure>
          <span class="polaroid-heart" aria-hidden="true">💖</span>
          <figure class="polaroid right">
            <img src="img/aidan-kecil.jpg" alt="Aidan Jr">
            <figcaption>Aidan Jr 🐱</figcaption>
          </figure>
        </div>
        <div class="letter-body" id="letter-body"></div>
        <p class="letter-sign">— <span id="letter-from"></span> 💖</p>
      </article>
      <button class="btn" data-go="map">Kembali ke peta</button>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script type="module" src="js/main.js"></script>
</body>
</html>
